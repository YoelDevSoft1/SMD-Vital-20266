<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>SMD Vital - Sin conexion</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0f172a;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 24px;
        align-items: stretch;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 14px 20px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        border: 0;
        font-family: inherit;
        transition: opacity 200ms, transform 200ms;
      }
      button:active { transform: scale(0.97); }
      button:disabled { opacity: 0.5; cursor: progress; }
      .primary {
        background: #06b6d4;
        color: #0f172a;
      }
      .primary:hover { background: #22d3ee; }
      .ghost {
        background: transparent;
        color: #67e8f9;
        border: 1px solid rgba(103, 232, 249, 0.4);
        font-size: 13px;
        padding: 10px 16px;
      }
      .ghost:hover { background: rgba(103, 232, 249, 0.1); }
      .hint {
        margin-top: 24px;
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.5;
      }
      .status {
        margin-top: 18px;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.05);
        color: #cbd5e1;
        display: none;
        white-space: pre-wrap;
      }
      .status.show { display: block; }
      .status.success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
      .status.error { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexion</h1>
      <p id="msg">
        No pudimos cargar la app. Si Render free tier se estaba
        despertando, espera unos segundos y toca <strong>Reintentar</strong>.
      </p>
      <div class="actions">
        <button type="button" class="primary" id="retry">Reintentar</button>
        <button type="button" class="ghost" id="clear-sw">Limpiar cache y reintentar</button>
      </div>
      <div id="status" class="status"></div>
      <p class="hint">
        Si el boton "Reintentar" no funciona, prueba "Limpiar cache".
        Eso desinstala la version vieja del cache del navegador.
      </p>
    </main>
    <script>
      (function () {
        var retry = document.getElementById('retry');
        var clearSW = document.getElementById('clear-sw');
        var msg = document.getElementById('msg');
        var statusEl = document.getElementById('status');

        function showStatus(text, kind) {
          statusEl.textContent = text;
          statusEl.classList.remove('success', 'error');
          if (kind) statusEl.classList.add(kind);
          statusEl.classList.add('show');
        }

        // Recarga dura con cache-busting query param. Asi evitamos que el SW
        // sirva una version vieja del index.html.
        function hardReload() {
          // Vamos a una URL nueva con ?_=timestamp para que NINGUN cache
          // (browser ni SW) la confunda con una navegacion cacheada.
          window.location.replace('/?_cb=' + Date.now());
        }

        function setButtonsBusy(busy) {
          retry.disabled = busy;
          clearSW.disabled = busy;
        }

        retry.addEventListener('click', function () {
          setButtonsBusy(true);
          showStatus('Reintentando...', null);
          // No fechamos al backend primero. Vamos directo a la app. Si la
          // app falla de nuevo, el usuario vera el error real y puede
          // elegir Limpiar cache.
          setTimeout(hardReload, 100);
        });

        clearSW.addEventListener('click', function () {
          setButtonsBusy(true);
          showStatus('Limpiando cache...', null);
          // IMPORTANTE: NO auto-recargar antes de terminar el cleanup. El
          // antiguo codigo recargaba despues de unregister(), lo que causaba
          // un loop infinito con el SW atrapado.
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) {
                return Promise.all(regs.map(function (r) {
                  return r.unregister().catch(function () { return null; });
                }));
              })
              .then(function () {
                if ('caches' in window) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) {
                      return caches.delete(k).catch(function () { return null; });
                    }));
                  });
                }
                return null;
              })
              .then(function () {
                showStatus('Cache limpio. Recargando...', 'success');
                // Pequeño delay para que el usuario vea el exito.
                setTimeout(hardReload, 600);
              })
              .catch(function (err) {
                showStatus('Error limpiando: ' + (err && err.message || err), 'error');
                setButtonsBusy(false);
              });
          } else {
            setTimeout(hardReload, 600);
          }
        });

        // NO auto-ping, NO auto-reload, NO listeners que disparen recargas.
        // El usuario debe tocar un boton. iOS Safari atrapado en SW + Render
        // dormido = loop infinito garantizado si recargas automaticamente.
      })();
    </script>
  </body>
</html>
