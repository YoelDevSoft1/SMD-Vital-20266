<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>SMD Vital - Sin conexion</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0f172a;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 24px;
      }
      button, a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 12px 20px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
        border: 0;
        font-family: inherit;
      }
      .primary {
        background: #06b6d4;
        color: #0f172a;
      }
      .primary:hover { background: #22d3ee; }
      .ghost {
        background: transparent;
        color: #67e8f9;
        border: 1px solid rgba(103, 232, 249, 0.4);
      }
      .ghost:hover { background: rgba(103, 232, 249, 0.1); }
      .hint {
        margin-top: 18px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexion</h1>
      <p id="msg">SMD Vital no puede conectarse en este momento. Revisa la senal e intenta de nuevo; las pantallas visitadas recientemente pueden abrirse al volver.</p>
      <div class="actions">
        <button type="button" class="primary" id="retry">Reintentar</button>
        <button type="button" class="ghost" id="clear-sw">Limpiar cache y reintentar</button>
      </div>
      <p class="hint" id="hint">Si Render free tier se esta despertando, espera 5-10s y reintenta automaticamente.</p>
    </main>
    <script>
      (function () {
        var retry = document.getElementById('retry');
        var clearSW = document.getElementById('clear-sw');
        var msg = document.getElementById('msg');
        var hint = document.getElementById('hint');
        var reloadTimer = null;

        function scheduleAutoReload() {
          // Si en 8s vuelve online, recargamos solos para salir del offline.html
          // automaticamente sin que el usuario tenga que tocar nada.
          clearTimeout(reloadTimer);
          reloadTimer = setTimeout(function () {
            if (navigator.onLine) {
              window.location.replace('/login?_=' + Date.now());
            }
          }, 8000);
        }

        function pingBackend() {
          // Hacemos un fetch lightweight al health del backend para decidir
          // si Render ya desperto. Si responde 200, recargamos.
          fetch('https://smdvital-backend.onrender.com/api/v1/health', {
            cache: 'no-store',
            mode: 'cors',
          })
            .then(function (r) {
              if (r.ok) {
                msg.textContent = 'Conexion recuperada. Volvemos a la app...';
                window.location.replace('/login?_=' + Date.now());
              } else {
                scheduleAutoReload();
              }
            })
            .catch(function () {
              scheduleAutoReload();
            });
        }

        retry.addEventListener('click', function () {
          pingBackend();
        });
        clearSW.addEventListener('click', function () {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }).then(function () {
              return caches.keys();
            }).then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).then(function () {
              window.location.replace('/login?_=' + Date.now());
            });
          } else {
            window.location.replace('/login?_=' + Date.now());
          }
        });

        // Auto-intento: si el navegador detecta online, pinguea el backend.
        window.addEventListener('online', pingBackend);
        if (navigator.onLine) {
          pingBackend();
        } else {
          scheduleAutoReload();
        }
      })();
    </script>
  </body>
</html>
