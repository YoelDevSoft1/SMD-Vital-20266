# =============================================================================
# Fly.io configuration for SMD Vital Bogotá
# =============================================================================
# Despliega el admin panel (Vite + nginx en contenedor) en Fly.io.
# El backend queda donde esta (Render por ahora). Cuando el backend migre a
# Fly tambien, agregamos un segundo [[services]] block apuntando a ese.
#
# Como usar:
#   1. fly launch --copy-config --no-deploy   (si queres rehacer el wizard)
#   2. fly secrets set VITE_API_URL=https://<tu-backend>/api/v1
#   3. fly deploy
# =============================================================================

app = "smd-vital-20266"
primary_region = "ams"

# Apuntamos al Dockerfile del admin panel (subdir del monorepo).
[build]
  dockerfile = "./admin-panel-frontend/Dockerfile"
  # Las builds en Fly.io reciben automaticamente ARGs del toml [build.args].

[build.args]
  # Si Render sigue siendo el backend, esta URL queda embebida en el bundle.
  # Cambiala cuando migres el backend a Fly.io.
  VITE_API_URL = "https://smdvital-backend.onrender.com/api/v1"

# -----------------------------------------------------------------------------
# Variables de runtime (montadas como env vars en el contenedor)
# -----------------------------------------------------------------------------
[env]
  # Que el SW se active en el navegador
  VITE_ENABLE_PWA = "true"
  # Para nginx / healthcheck
  PORT = "8080"
  NODE_ENV = "production"

# -----------------------------------------------------------------------------
# Servicio HTTP publico
# -----------------------------------------------------------------------------
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_start_machines = true
  auto_stop_machines = false   # NO dormir en free tier (es lo que evita el cold-start de Render)

  # Asignacion de procesos: queremos al menos 1 maquina always-on
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/login"
    protocol = "http"

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 60

# -----------------------------------------------------------------------------
# Puertos publicos: 80 (http, redirigido a https) y 443 (https)
# -----------------------------------------------------------------------------
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

# -----------------------------------------------------------------------------
# Recursos de la maquina
# -----------------------------------------------------------------------------
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# -----------------------------------------------------------------------------
# Disco persistente: ninguno (es static site)
# [[mounts]]
#   source = "smd_data"
#   destination = "/data"
# -----------------------------------------------------------------------------

# NO usar:
# [deploy] release_command = "npm run migrate"   ← no aplica (es static)
